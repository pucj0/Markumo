name: Extended Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Continuous browser editing minutes (0 to 60; use 30 for acceptance)
        default: '0'
        required: true
        type: choice
        options: ['0', '30', '60']

permissions:
  contents: read

concurrency:
  group: extended-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Production and development advisory results are collected separately so a
  # clean production audit can never hide a development-toolchain advisory.
  dependency-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 12.11.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Production dependency advisory audit
        run: |
          mkdir -p test-results/phase07.1
          pnpm audit --prod --audit-level=moderate --json --registry=https://registry.npmjs.org > test-results/phase07.1/audit-prod.json
      - name: Full dependency advisory audit
        if: always()
        run: |
          mkdir -p test-results/phase07.1
          pnpm audit --audit-level=moderate --json --registry=https://registry.npmjs.org > test-results/phase07.1/audit-all.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-advisories
          retention-days: 7
          path: |
            test-results/phase07.1/audit-prod.json
            test-results/phase07.1/audit-all.json

  # Strict Rust checks run on the actual Windows target used by the release.
  rust-strict:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Locked Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  browser-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 12.11.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Production dependency advisory audit
        run: pnpm audit --prod --audit-level=moderate --registry=https://registry.npmjs.org
      - run: pnpm exec playwright install --with-deps chromium
      - name: Generate isolated media fixtures
        run: |
          python -m pip install 'Pillow>=11,<13' 'reportlab>=4,<5' 'pypdf>=5,<7'
          python scripts/media-fixtures.py .markumo-media-test/fixtures
      - name: Full regression suite
        run: pnpm test:regression
      - name: Production editor/viewer resource cycles and optional soak
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes || '0' }}
        run: node scripts/phase07-browser-audit.mjs --label=ci --soak-minutes="$SOAK_MINUTES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extended-quality-evidence
          retention-days: 7
          path: |
            test-results/phase07/**/*.json
            test-results/phase07/**/*.heapsnapshot
            test-results/phase07.1/**/*.json
            test-results/phase07.1/**/*.log
            test-results/regression-logs/**
            .markumo-media-test/browser-metrics.json
