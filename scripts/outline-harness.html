<!doctype html><html><head><meta charset="utf-8"><title>Outline regression</title></head>
<body style="margin:0"><div id="app" style="height:700px;display:flex"></div><script type="module">
import {createApp,h,ref,markRaw} from 'vue'
import EditorContainer from '/src/components/layout/EditorContainer.vue'
import OutlineView from '/src/components/layout/OutlineView.vue'
import {DocumentManager} from '/src/editor/core/DocumentManager.ts'
import {extractOutline} from '/src/editor/outline/outlineService.ts'
import '/src/styles/variables.css'
import '/src/styles/reset.css'
import '/src/styles/main.css'
const manager=new DocumentManager([]),revision=ref(0)
manager.subscribe(()=>revision.value++)
const id=manager.createUntitled('md');manager.setMarkdownMode(id,'source')
manager.dispatch(id,{changes:{from:0,insert:'# **一级标题**\n\n## 子标题 `code`\n\n### [链接](https://example.invalid/)\n\n# <img src=x onerror="window.outlineXss=true"> 安全标题\n\n## ![图](https://example.invalid/outline-should-not-load.png)'}})
createApp({setup(){return()=>{
  revision.value
  const doc=manager.activeDocument,items=extractOutline(doc,manager.getState(id))
  return [h('aside',{class:'test-sidebar',style:'width:260px;flex:none;border-right:1px solid var(--line)'},[
    h('h4',{style:'padding:10px'},'文档大纲'),h(OutlineView,{items,isMarkdown:true,onSelectItem:item=>manager.revealPosition(id,item.lineNumber,1)})
  ]),h(EditorContainer,{manager:markRaw(manager),doc,showOutline:true,desktop:false})]
}}}).mount('#app')
window.outlineTest={manager,id}
</script></body></html>
