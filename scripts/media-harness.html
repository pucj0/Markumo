<!doctype html><html><head><meta charset="utf-8"><title>Media regression harness</title></head>
<body style="margin:0"><div id="app" style="height:800px;display:flex"></div><script type="module">
// Test-only host. Built application entry never imports this file.
import {createApp,h,ref,markRaw} from 'vue'
import EditorPane from '/src/components/layout/EditorPane.vue'
import SplitLayoutNode from '/src/components/layout/SplitLayoutNode.vue'
import {DocumentManager} from '/src/editor/core/DocumentManager.ts'
import {FileController} from '/src/features/files/FileController.ts'
import '/src/styles/variables.css'
import '/src/styles/reset.css'
import '/src/styles/main.css'
const manager=new DocumentManager([],async()=>[]), revision=ref(0)
const released=[]
const controller=new FileController(manager,{release:async(token)=>{released.push(token)}},message=>console.error(message))
manager.subscribe(()=>revision.value++)
const blobs=new Set(),workers=new Set(),requests=[]
const create=URL.createObjectURL.bind(URL),revoke=URL.revokeObjectURL.bind(URL),OriginalWorker=Worker
URL.createObjectURL=(blob)=>{const url=create(blob);blobs.add(url);return url}
URL.revokeObjectURL=(url)=>{blobs.delete(url);revoke(url)}
window.Worker=class extends OriginalWorker {constructor(...args){super(...args);workers.add(this)}terminate(){workers.delete(this);super.terminate()}}
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
  if(command==='media_metadata'){const r=await fetch(`/test-media/${encodeURIComponent(args.token)}?meta=1`);if(!r.ok)throw new Error(await r.text());return r.json()}
  if(command==='read_media_chunk'){requests.push(args);const r=await fetch(`/test-media/${encodeURIComponent(args.token)}?offset=${args.offset}&length=${args.length}`);if(!r.ok)throw new Error(await r.text());return r.arrayBuffer()}
  throw new Error('Unexpected IPC: '+command)
}}
const fullLayout=new URLSearchParams(location.search).has('layout')
createApp({setup(){return()=>{revision.value;return fullLayout
  ? h(SplitLayoutNode,{manager:markRaw(manager),node:manager.layout.root,revision:revision.value,desktop:false,files:markRaw(controller)})
  : h(EditorPane,{manager:markRaw(manager),pane:'main',doc:manager.activeDocument})}}}).mount('#app')
window.mediaTest={manager,controller,released,blobs,workers,requests,async open(name,preview=false){
  const [media,version]=await window.__TAURI_INTERNALS__.invoke('media_metadata',{token:name})
  controller.accept({token:name,name,path:'E:/fixture/'+name,kind:name.endsWith('.pdf')?'pdf':'image',text:'',media,encoding:'Binary',bom:false,eol:'LF',readOnly:true,version},preview)
  return manager.activeId
},close(){if(manager.activeId)manager.close(manager.activeId,true)},text(){return manager.createUntitled('txt')}}
</script></body></html>
