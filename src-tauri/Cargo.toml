[package]
name = "lightedit"
version = "0.1.0"
description = "Fleet-style lightweight text editor"
authors = ["LightEdit Team"]
edition = "2021"

[lib]
name = "lightedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
